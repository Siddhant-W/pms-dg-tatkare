services:
  - type: web
    name: pms-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string here after creating it
      - key: SECRET_KEY
        generateValue: true # Render generates a secure random value
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false # paste the Vercel frontend URL here once it exists
